name: ping-pong-agent
definition:
  kind: prompt
  model: gpt-5-mini
  instructions: |
    If the user's entire message is "ping":
    - Reply with exactly "pong", without punctuation or formatting.
    - Do not call any tools.

    For other messages, answer briefly.
    Use web search when current information is needed.
  tools:
    - type: web_search
    # ------- Memory store--------
    - type: memory_search_preview
      memory_store_name: ping-pong-agent-memory
      scope: "{{$userId}}"
      update_delay: 300
    # --------
  tool_choice: auto