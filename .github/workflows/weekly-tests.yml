name: Weekly tests

on:
  schedule:
    # GitHub Actions schedules use UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      azure-environment:
        description: azd environment name to test
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: weekly-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_ENV_NAME: ${{ inputs.azure-environment || vars.AZURE_ENV_NAME }}
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load infrastructure outputs
        shell: bash
        run: |
          if [[ -z "$AZURE_ENV_NAME" ]]; then
            echo "::error::Set the AZURE_ENV_NAME repository variable or provide azure-environment when starting the workflow manually."
            exit 1
          fi

          outputs="$(az deployment group show \
            --resource-group "rg-$AZURE_ENV_NAME" \
            --name cosmopilot-resources \
            --query properties.outputs \
            --output json)"
          project_endpoint="$(jq -r '.foundryProjectEndpoint.value // empty' <<< "$outputs")"
          deployment_name="$(jq -r '.modelDeploymentName.value // empty' <<< "$outputs")"

          if [[ -z "$project_endpoint" || -z "$deployment_name" ]]; then
            echo "::error::The cosmopilot-resources deployment did not return the required test outputs."
            exit 1
          fi

          echo "AZURE_AI_PROJECT_ENDPOINT=$project_endpoint" >> "$GITHUB_ENV"
          echo "AZURE_DEPLOYMENT_NAME=$deployment_name" >> "$GITHUB_ENV"

      - name: Run all tests
        run: python -m pytest tests --tb=short